<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Libri in Scatola</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    header {
      background: #2b6cb0;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header h1 { font-size: 1.3rem; font-weight: 700; }

    #btn-nuova-scatola {
      background: #f6ad55;
      color: #1a202c;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    #btn-nuova-scatola:active { background: #ed8936; }

    main { padding: 16px; max-width: 600px; margin: 0 auto; }

    /* Scatola attiva */
    #scatola-attiva {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }

    #scatola-attiva .label {
      font-size: 0.85rem;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    #scatola-attiva .numero {
      font-size: 3.5rem;
      font-weight: 900;
      color: #2b6cb0;
      line-height: 1;
    }

    #scatola-attiva .conteggio {
      font-size: 0.95rem;
      color: #718096;
      margin-top: 6px;
    }

    /* Scanner */
    #scanner-section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    #scanner-section h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #2d3748;
    }

    #video-container {
      position: relative;
      width: 100%;
      max-height: 220px;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      display: none;
      margin-bottom: 12px;
    }

    #video-container video {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
    }

    /* mirino centrale */
    #mirino {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 70%; max-width: 260px;
      height: 80px;
      border: 3px solid #f6ad55;
      border-radius: 8px;
      box-shadow: 0 0 0 1000px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    #scan-line {
      position: absolute;
      left: 15%; right: 15%;
      height: 2px;
      background: #f6ad55;
      top: 50%;
      animation: scan 1.5s ease-in-out infinite;
    }

    @keyframes scan {
      0%, 100% { top: 30%; }
      50% { top: 70%; }
    }

    #btn-scan {
      width: 100%;
      background: #2b6cb0;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #btn-scan:active { background: #2c5282; }
    #btn-scan.attivo { background: #c53030; }
    #btn-scan.attivo:active { background: #9b2c2c; }

    #isbn-manuale-row {
      display: flex;
      gap: 8px;
    }

    #isbn-input {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      -webkit-appearance: none;
    }
    #isbn-input:focus { border-color: #2b6cb0; }

    #btn-aggiungi {
      background: #38a169;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    #btn-aggiungi:active { background: #276749; }

    #feedback {
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
      text-align: center;
    }
    #feedback.ok { background: #c6f6d5; color: #22543d; display: block; }
    #feedback.errore { background: #fed7d7; color: #742a2a; display: block; }

    /* Lista scatole */
    #lista-scatole { }

    #lista-scatole h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #2d3748;
    }

    .scatola-card {
      background: white;
      border-radius: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .scatola-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .scatola-header:active { background: #f7fafc; }

    .scatola-titolo {
      font-weight: 700;
      font-size: 1rem;
      color: #2b6cb0;
    }

    .scatola-info {
      font-size: 0.85rem;
      color: #718096;
    }

    .scatola-toggle {
      font-size: 1.1rem;
      color: #a0aec0;
      transition: transform 0.2s;
    }
    .scatola-toggle.aperta { transform: rotate(180deg); }

    .scatola-libri {
      display: none;
      padding: 0 18px 14px;
      border-top: 1px solid #f0f4f8;
    }
    .scatola-libri.visibile { display: block; }

    .libro-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f4f8;
      font-size: 0.9rem;
    }
    .libro-item:last-child { border-bottom: none; }

    .libro-isbn { color: #718096; font-family: monospace; font-size: 0.8rem; }
    .libro-titolo { color: #2d3748; font-weight: 600; font-size: 0.9rem; }
    .libro-autore { color: #718096; font-size: 0.82rem; }

    .libro-azioni { display: flex; gap: 4px; flex-shrink: 0; }

    .btn-stampa {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      color: #718096;
    }
    .btn-stampa:active { background: #f0f4f8; }

    .btn-rimuovi, .btn-modifica {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .btn-rimuovi { color: #e53e3e; }
    .btn-rimuovi:active { background: #fff5f5; }
    .btn-modifica { color: #3182ce; }
    .btn-modifica:active { background: #ebf8ff; }

    /* pannello modifica titolo inline */
    .modifica-panel {
      display: none;
      padding: 8px 0 4px;
    }
    .modifica-panel.visibile { display: flex; flex-direction: column; gap: 6px; }
    .modifica-panel input {
      width: 100%;
      border: 2px solid #3182ce;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      outline: none;
    }
    .modifica-panel .modifica-azioni { display: flex; gap: 6px; }
    .btn-salva-titolo {
      background: #38a169;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Risultati ricerca */
    #risultati-ricerca .res-item {
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #risultati-ricerca .res-titolo { font-weight: 600; font-size: 0.9rem; color: #2d3748; }
    #risultati-ricerca .res-autore { font-size: 0.82rem; color: #718096; }
    #risultati-ricerca .res-isbn { font-size: 0.78rem; color: #a0aec0; font-family: monospace; }
    #risultati-ricerca .res-scatola {
      background: #2b6cb0;
      color: white;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      margin-left: 10px;
    }
    #nessun-risultato {
      text-align: center;
      color: #a0aec0;
      padding: 20px;
      font-size: 0.95rem;
    }

    .nessun-libro {
      color: #a0aec0;
      font-size: 0.85rem;
      padding: 8px 0;
      font-style: italic;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px 16px;
      color: #a0aec0;
      font-size: 0.8rem;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #2d3748;
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 600;
      z-index: 1000;
      transition: transform 0.3s ease;
      white-space: nowrap;
      pointer-events: none;
    }
    #toast.visibile { transform: translateX(-50%) translateY(0); }

    /* Empty state */
    #empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #a0aec0;
    }
    #empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
    #empty-state p { font-size: 0.95rem; line-height: 1.5; }
  </style>
</head>
<body>

<header>
  <h1>📦 Libri in Scatola</h1>
  <button id="btn-nuova-scatola">+ Nuova scatola</button>
</header>

<main>

  <!-- Scatola attiva -->
  <div id="scatola-attiva">
    <div class="label">Stai riempiendo</div>
    <div class="numero" id="numero-scatola">1</div>
    <div class="conteggio" id="conteggio-scatola">0 libri</div>
  </div>

  <!-- Scanner -->
  <div id="scanner-section">
    <h2>Scansiona ISBN</h2>
    <div id="video-container">
      <video id="video" autoplay playsinline muted></video>
      <div id="mirino"></div>
      <div id="scan-line"></div>
    </div>
    <button id="btn-scan">
      <span>📷</span> Apri fotocamera
    </button>
    <div id="isbn-manuale-row">
      <input id="isbn-input" type="number" inputmode="numeric" placeholder="ISBN manuale..." />
      <button id="btn-aggiungi">Aggiungi</button>
    </div>
    <div id="feedback"></div>

    <!-- Pannello titolo manuale (appare solo se titolo non trovato) -->
    <div id="titolo-panel" style="display:none; margin-top:14px; background:#fffbeb; border:2px solid #f6ad55; border-radius:12px; padding:16px;">
      <div style="font-size:0.9rem; font-weight:700; margin-bottom:4px; color:#92400e;">Titolo non trovato per:</div>
      <div id="titolo-isbn-label" style="font-family:monospace; color:#4a5568; margin-bottom:12px; font-size:0.85rem;"></div>
      <input id="titolo-input" type="text" placeholder="Titolo (opzionale)…"
        style="width:100%; border:2px solid #e2e8f0; border-radius:10px; padding:12px 14px; font-size:1rem; margin-bottom:8px; outline:none;" />
      <input id="autore-input" type="text" placeholder="Autore (opzionale)…"
        style="width:100%; border:2px solid #e2e8f0; border-radius:10px; padding:12px 14px; font-size:1rem; margin-bottom:10px; outline:none;" />
      <div style="display:flex; gap:8px;">
        <button id="btn-titolo-conferma" style="flex:1; background:#38a169; color:white; border:none; border-radius:10px; padding:12px; font-size:1rem; font-weight:700; cursor:pointer;">Conferma</button>
        <button id="btn-titolo-annulla" style="background:#e2e8f0; color:#4a5568; border:none; border-radius:10px; padding:12px 16px; font-size:1rem; font-weight:700; cursor:pointer;">Annulla</button>
      </div>
    </div>
  </div>

  <!-- Lista scatole -->
  <div id="lista-scatole">
    <h2>Tutte le scatole</h2>

    <div id="cerca-container" style="margin-bottom:14px; position:relative;">
      <input id="cerca-input" type="text" placeholder="🔍 Cerca per titolo, autore o ISBN…"
        style="width:100%; border:2px solid #e2e8f0; border-radius:12px; padding:12px 40px 12px 14px; font-size:1rem; outline:none; background:white; box-shadow:0 2px 8px rgba(0,0,0,0.06);" />
      <button id="cerca-clear" style="display:none; position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:1.2rem; color:#a0aec0; cursor:pointer; padding:4px;">✕</button>
    </div>

    <div id="risultati-ricerca" style="display:none; margin-bottom:12px;"></div>

    <div id="scatole-container">
      <div id="empty-state">
        <div class="emoji">📦</div>
        <p>Nessun libro ancora.<br>Scansiona il primo ISBN!</p>
      </div>
    </div>
  </div>

</main>

<footer>Dati salvati sul tuo telefono</footer>

<div id="toast"></div>

<!-- ZXing per la scansione barcode -->
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>

<script>
// ── STATO ─────────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'libri-in-scatola-v1';

function caricaDati() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const dati = JSON.parse(raw);
      // migrazione: converte stringhe ISBN in oggetti {isbn, titolo, autore}
      for (const num of Object.keys(dati.scatole)) {
        dati.scatole[num] = dati.scatole[num].map(l =>
          typeof l === 'string' ? { isbn: l, titolo: l, autore: '' } : l
        );
      }
      return dati;
    }
  } catch(e) {}
  return { scatolaAttiva: 1, scatole: {} };
}

// ogni libro è { isbn, titolo, autore }
async function cercaLibro(isbn) {
  // 1. Google Books — solo edizioni italiane
  try {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}&langRestrict=it`);
    const json = await r.json();
    if (json.totalItems > 0) {
      const info = json.items[0].volumeInfo;
      return { isbn, titolo: info.title || isbn, autore: info.authors ? info.authors.join(', ') : '' };
    }
  } catch(e) {}

  // 2. Google Books — senza restrizione lingua (libri stranieri)
  try {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
    const json = await r.json();
    if (json.totalItems > 0) {
      const info = json.items[0].volumeInfo;
      return { isbn, titolo: info.title || isbn, autore: info.authors ? info.authors.join(', ') : '' };
    }
  } catch(e) {}

  // 3. Open Library come ultimo tentativo
  try {
    const r = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const json = await r.json();
    const dati = json[`ISBN:${isbn}`];
    if (dati) {
      return { isbn, titolo: dati.title || isbn, autore: dati.authors ? dati.authors.map(a => a.name).join(', ') : '' };
    }
  } catch(e) {}

  return { isbn, titolo: isbn, autore: '' };
}

function salvaDati() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(stato));
}

let stato = caricaDati();
// Assicura che la scatola attiva esista
if (!stato.scatole[stato.scatolaAttiva]) {
  stato.scatole[stato.scatolaAttiva] = [];
}

// ── SCANNER ───────────────────────────────────────────────────────────────────

let streamAttivo = null;
let scannerAttivo = false;
let rafId = null;
let zxingReader = null;

const videoContainer = document.getElementById('video-container');
const videoEl = document.getElementById('video');
const btnScan = document.getElementById('btn-scan');
const isbnInput = document.getElementById('isbn-input');
const btnAggiungi = document.getElementById('btn-aggiungi');
const feedback = document.getElementById('feedback');

const usaBarcodeDetector = ('BarcodeDetector' in window);

async function avviaScanner() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 },
        focusMode: { ideal: 'continuous' }
      }
    });
    streamAttivo = stream;
    videoEl.srcObject = stream;
    await videoEl.play();

    videoContainer.style.display = 'block';
    btnScan.classList.add('attivo');
    btnScan.innerHTML = '<span>⏹</span> Ferma scansione';
    scannerAttivo = true;
    mostraFeedback('', '');

    if (usaBarcodeDetector) {
      avviaConBarcodeDetector();
    } else {
      avviaConZXing();
    }
  } catch(e) {
    mostraFeedback('Errore fotocamera: ' + (e.message || 'permesso negato'), 'errore');
    fermaScanner();
  }
}

// Metodo 1: BarcodeDetector (Android Chrome nativo — molto veloce)
async function avviaConBarcodeDetector() {
  const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'upc_a', 'upc_e'] });
  let ultimoValore = null;
  let primaVolta = null;
  const CONFERMA_MS = 1200;

  async function tick() {
    if (!scannerAttivo) return;
    try {
      const barcodes = await detector.detect(videoEl);
      if (barcodes.length > 0) {
        const isbn = barcodes[0].rawValue.replace(/\D/g, '');
        if (isbn.length >= 10) {
          const ora = Date.now();
          if (isbn !== ultimoValore) {
            ultimoValore = isbn;
            primaVolta = ora;
            mostraFeedback('📷 Codice trovato, tieni fermo…', 'ok');
          } else if (ora - primaVolta >= CONFERMA_MS) {
            fermaScanner();
            aggiungiLibro(isbn);
            return;
          }
        }
      } else {
        if (ultimoValore) {
          ultimoValore = null;
          primaVolta = null;
          mostraFeedback('', '');
        }
      }
    } catch(e) {}
    setTimeout(() => { if (scannerAttivo) tick(); }, 200);
  }
  tick();
}

// Metodo 2: ZXing fallback
async function avviaConZXing() {
  if (typeof ZXing === 'undefined') {
    mostraFeedback('Scanner non disponibile su questo browser. Usa inserimento manuale.', 'errore');
    fermaScanner();
    return;
  }
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const hints = new Map();
  const formats = [
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.UPC_A,
  ];
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
  const reader = new ZXing.MultiFormatReader();
  reader.setHints(hints);
  zxingReader = reader;

  let ultimoValoreZ = null;
  let primaVoltaZ = null;
  const CONFERMA_MS_Z = 1200;

  function tick() {
    if (!scannerAttivo) return;
    if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      ctx.drawImage(videoEl, 0, 0);
      try {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const luminance = new ZXing.RGBLuminanceSource(imageData.data, canvas.width, canvas.height);
        const binary = new ZXing.HybridBinarizer(luminance);
        const bitmap = new ZXing.BinaryBitmap(binary);
        const result = reader.decode(bitmap);
        if (result) {
          const isbn = result.getText().replace(/\D/g, '');
          if (isbn.length >= 10) {
            const ora = Date.now();
            if (isbn !== ultimoValoreZ) {
              ultimoValoreZ = isbn;
              primaVoltaZ = ora;
              mostraFeedback('📷 Codice trovato, tieni fermo…', 'ok');
            } else if (ora - primaVoltaZ >= CONFERMA_MS_Z) {
              fermaScanner();
              aggiungiLibro(isbn);
              return;
            }
          }
        } else {
          ultimoValoreZ = null; primaVoltaZ = null;
        }
      } catch(e) {
        ultimoValoreZ = null; primaVoltaZ = null;
      }
    }
    setTimeout(() => { if (scannerAttivo) tick(); }, 200);
  }
  tick();
}

function fermaScanner() {
  scannerAttivo = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (streamAttivo) {
    streamAttivo.getTracks().forEach(t => t.stop());
    streamAttivo = null;
  }
  videoEl.srcObject = null;
  videoContainer.style.display = 'none';
  btnScan.classList.remove('attivo');
  btnScan.innerHTML = '<span>📷</span> Apri fotocamera';
}

btnScan.addEventListener('click', () => {
  if (scannerAttivo) fermaScanner();
  else avviaScanner();
});

// ── AGGIUNTA LIBRO ─────────────────────────────────────────────────────────────

async function aggiungiLibro(isbn) {
  isbn = String(isbn).trim().replace(/\D/g, '');
  if (!isbn || isbn.length < 10) {
    mostraFeedback('ISBN non valido (min. 10 cifre).', 'errore');
    return;
  }

  // Controlla duplicato globale
  for (const [num, libri] of Object.entries(stato.scatole)) {
    if (libri.find(l => l.isbn === isbn)) {
      mostraFeedback(`⚠️ ISBN già nella Scatola ${num}!`, 'errore');
      return;
    }
  }

  mostraFeedback('🔍 Cerco il titolo…', 'ok');
  const libro = await cercaLibro(isbn);

  if (libro.titolo === isbn) {
    // titolo non trovato: chiedi manualmente
    mostraFeedback('', '');
    mostraPannelloTitolo(isbn);
    return;
  }

  salvaEAggiungi(libro);
  isbnInput.value = '';
}

function salvaEAggiungi(libro) {
  stato.scatole[stato.scatolaAttiva].push(libro);
  salvaDati();
  aggiornaUI();
  isbnInput.value = '';
  const etichetta = libro.titolo !== libro.isbn ? `"${libro.titolo}"` : `ISBN ${libro.isbn}`;
  mostraToast(`📗 ${etichetta} → Scatola ${stato.scatolaAttiva}`);
  mostraFeedback('', '');
}

let isbnInAttesa = null;

function mostraPannelloTitolo(isbn) {
  isbnInAttesa = isbn;
  document.getElementById('titolo-isbn-label').textContent = isbn;
  document.getElementById('titolo-input').value = '';
  document.getElementById('autore-input').value = '';
  document.getElementById('titolo-panel').style.display = 'block';
  setTimeout(() => document.getElementById('titolo-input').focus(), 100);
}

function chiudiPannelloTitolo() {
  isbnInAttesa = null;
  document.getElementById('titolo-panel').style.display = 'none';
  document.getElementById('titolo-input').value = '';
  document.getElementById('autore-input').value = '';
}

document.getElementById('btn-titolo-conferma').addEventListener('click', () => {
  if (!isbnInAttesa) return;
  const titolo = document.getElementById('titolo-input').value.trim() || isbnInAttesa;
  const autore = document.getElementById('autore-input').value.trim();
  salvaEAggiungi({ isbn: isbnInAttesa, titolo, autore });
  chiudiPannelloTitolo();
});

document.getElementById('btn-titolo-annulla').addEventListener('click', chiudiPannelloTitolo);

document.getElementById('titolo-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-titolo-conferma').click();
  if (e.key === 'Escape') chiudiPannelloTitolo();
});

btnAggiungi.addEventListener('click', () => aggiungiLibro(isbnInput.value));

isbnInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') aggiungiLibro(isbnInput.value);
});

// ── NUOVA SCATOLA ─────────────────────────────────────────────────────────────

document.getElementById('btn-nuova-scatola').addEventListener('click', () => {
  const nuovoNum = Math.max(...Object.keys(stato.scatole).map(Number), 0) + 1;
  stato.scatolaAttiva = nuovoNum;
  stato.scatole[nuovoNum] = [];
  salvaDati();
  aggiornaUI();
  mostraToast(`📦 Scatola ${nuovoNum} creata!`);
  fermaScanner();
});

// ── RIMOZIONE LIBRO ───────────────────────────────────────────────────────────

function rimuoviLibro(scatola, isbn) {
  stato.scatole[scatola] = stato.scatole[scatola].filter(l => l.isbn !== isbn);
  salvaDati();
  aggiornaUI();
  mostraToast('🗑️ Libro rimosso');
}

// ── UI ─────────────────────────────────────────────────────────────────────────

function aggiornaUI() {
  // Scatola attiva
  document.getElementById('numero-scatola').textContent = stato.scatolaAttiva;
  const n = (stato.scatole[stato.scatolaAttiva] || []).length;
  document.getElementById('conteggio-scatola').textContent =
    n === 1 ? '1 libro' : `${n} libri`;

  // Lista scatole
  const container = document.getElementById('scatole-container');
  const numeri = Object.keys(stato.scatole)
    .map(Number)
    .sort((a, b) => b - a); // dalla più recente

  const totLibri = Object.values(stato.scatole).reduce((s, a) => s + a.length, 0);

  if (totLibri === 0) {
    container.innerHTML = `
      <div id="empty-state">
        <div class="emoji">📦</div>
        <p>Nessun libro ancora.<br>Scansiona il primo ISBN!</p>
      </div>`;
    return;
  }

  container.innerHTML = numeri.map(num => {
    const libri = stato.scatole[num] || [];
    const isAttiva = num === stato.scatolaAttiva;
    return `
      <div class="scatola-card">
        <div class="scatola-header" onclick="toggleScatola(${num})">
          <div>
            <div class="scatola-titolo">
              📦 Scatola ${num}${isAttiva ? ' ✏️' : ''}
            </div>
            <div class="scatola-info">
              ${libri.length === 1 ? '1 libro' : `${libri.length} libri`}
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="btn-stampa" onclick="event.stopPropagation(); stampaScatola(${num})" title="Esporta PDF">🖨️</button>
            <div class="scatola-toggle" id="toggle-${num}">▼</div>
          </div>
        </div>
        <div class="scatola-libri" id="libri-${num}">
          ${libri.length === 0
            ? '<div class="nessun-libro">Nessun libro</div>'
            : libri.map((l, idx) => `
              <div class="libro-item" style="flex-direction:column; align-items:stretch;">
                <div style="display:flex; align-items:center; justify-content:space-between;">
                  <div>
                    <div class="libro-titolo">${l.titolo !== l.isbn ? l.titolo : '(titolo non trovato)'}</div>
                    ${l.autore ? `<div class="libro-autore">${l.autore}</div>` : ''}
                    <div class="libro-isbn">${l.isbn}</div>
                  </div>
                  <div class="libro-azioni">
                    <button class="btn-modifica" onclick="apriModifica(${num}, ${idx})" title="Modifica titolo">✏️</button>
                    <button class="btn-rimuovi" onclick="rimuoviLibro(${num}, '${l.isbn}')" title="Rimuovi">✕</button>
                  </div>
                </div>
                <div class="modifica-panel" id="modifica-${num}-${idx}">
                  <input type="text" id="input-modifica-${num}-${idx}" value="${l.titolo !== l.isbn ? l.titolo : ''}" placeholder="Titolo…" />
                  <input type="text" id="input-autore-${num}-${idx}" value="${l.autore || ''}" placeholder="Autore…" />
                  <div class="modifica-azioni">
                    <button class="btn-salva-titolo" style="flex:1;" onclick="salvaTitolo(${num}, ${idx})">✓ Salva</button>
                  </div>
                </div>
              </div>`).join('')
          }
        </div>
      </div>`;
  }).join('');
}

// ── STAMPA PDF ────────────────────────────────────────────────────────────────

function stampaScatola(num) {
  const libri = stato.scatole[num] || [];
  const righe = libri.map((l, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${l.titolo !== l.isbn ? l.titolo : '<em>senza titolo</em>'}</td>
      <td>${l.autore || '—'}</td>
      <td>${l.isbn}</td>
    </tr>`).join('');

  const html = `<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <title>Scatola ${num}</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 32px; color: #1a202c; }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .sub { color: #718096; margin-bottom: 24px; font-size: 0.95rem; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #2b6cb0; color: white; padding: 8px 12px; text-align: left; font-size: 0.85rem; }
    td { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.88rem; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: #f7fafc; }
    .footer { margin-top: 24px; font-size: 0.8rem; color: #a0aec0; }
    @media print { body { padding: 16px; } }
  </style>
</head>
<body>
  <h1>📦 Scatola ${num}</h1>
  <div class="sub">${libri.length} ${libri.length === 1 ? 'libro' : 'libri'} — stampato il ${new Date().toLocaleDateString('it-IT')}</div>
  <table>
    <thead><tr><th>#</th><th>Titolo</th><th>Autore</th><th>ISBN</th></tr></thead>
    <tbody>${righe}</tbody>
  </table>
  <div class="footer">Libri in Scatola</div>
  <script>window.onload = () => { window.print(); }<\/script>
</body>
</html>`;

  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
}

function apriModifica(num, idx) {
  const panel = document.getElementById(`modifica-${num}-${idx}`);
  const input = document.getElementById(`input-modifica-${num}-${idx}`);
  const aperto = panel.classList.toggle('visibile');
  if (aperto) setTimeout(() => input.focus(), 50);
}

function salvaTitolo(num, idx) {
  const nuovoTitolo = document.getElementById(`input-modifica-${num}-${idx}`).value.trim();
  const nuovoAutore = document.getElementById(`input-autore-${num}-${idx}`).value.trim();
  if (!nuovoTitolo) return;
  stato.scatole[num][idx].titolo = nuovoTitolo;
  stato.scatole[num][idx].autore = nuovoAutore;
  salvaDati();
  aggiornaUI();
  mostraToast('✏️ Libro aggiornato');
}

// ── RICERCA ───────────────────────────────────────────────────────────────────

const cercaInput = document.getElementById('cerca-input');
const cercaClear = document.getElementById('cerca-clear');
const risultatiEl = document.getElementById('risultati-ricerca');
const scatoleContainer = document.getElementById('scatole-container');

cercaInput.addEventListener('input', () => {
  const q = cercaInput.value.trim().toLowerCase();
  cercaClear.style.display = q ? 'block' : 'none';
  if (!q) {
    risultatiEl.style.display = 'none';
    risultatiEl.innerHTML = '';
    scatoleContainer.style.display = 'block';
    return;
  }
  scatoleContainer.style.display = 'none';
  risultatiEl.style.display = 'block';

  const trovati = [];
  for (const [num, libri] of Object.entries(stato.scatole)) {
    for (const l of libri) {
      if (
        l.titolo.toLowerCase().includes(q) ||
        l.autore.toLowerCase().includes(q) ||
        l.isbn.includes(q)
      ) {
        trovati.push({ ...l, scatola: num });
      }
    }
  }

  if (trovati.length === 0) {
    risultatiEl.innerHTML = '<div id="nessun-risultato">Nessun libro trovato</div>';
    return;
  }

  risultatiEl.innerHTML = trovati.map(l => `
    <div class="res-item">
      <div>
        <div class="res-titolo">${l.titolo !== l.isbn ? l.titolo : '(senza titolo)'}</div>
        ${l.autore ? `<div class="res-autore">${l.autore}</div>` : ''}
        <div class="res-isbn">${l.isbn}</div>
      </div>
      <div class="res-scatola">📦 ${l.scatola}</div>
    </div>`).join('');
});

cercaClear.addEventListener('click', () => {
  cercaInput.value = '';
  cercaInput.dispatchEvent(new Event('input'));
  cercaInput.focus();
});

function toggleScatola(num) {
  const libriEl = document.getElementById(`libri-${num}`);
  const toggleEl = document.getElementById(`toggle-${num}`);
  const aperta = libriEl.classList.toggle('visibile');
  toggleEl.classList.toggle('aperta', aperta);
}

// ── FEEDBACK & TOAST ──────────────────────────────────────────────────────────

function mostraFeedback(msg, tipo) {
  feedback.textContent = msg;
  feedback.className = tipo === 'ok' ? 'ok' : tipo === 'errore' ? 'errore' : '';
  if (tipo === 'ok') setTimeout(() => { feedback.className = ''; }, 2000);
}

let toastTimer = null;
function mostraToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('visibile');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visibile'), 2500);
}

// ── AVVIO ─────────────────────────────────────────────────────────────────────

aggiornaUI();
</script>
</body>
</html>
